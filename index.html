<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>欧洲之旅 · 旅行手册</title><style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1f2328;--mut:#6b7280;--ln:#e5e1d8;--ac:#b4532a;--ok:#2f7d4f;--warn:#b7791f;--no:#9ca3af;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222427;--tx:#ecebe8;--mut:#9aa0a8;--ln:#34373b;--ac:#e08a5f;--ok:#5cc08a;--warn:#e3b04b;--no:#6b7280;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
header{padding:18px 16px 4px;max-width:820px;margin:0 auto}h1{margin:0;font-size:21px}header p{margin:3px 0 0;color:var(--mut);font-size:12.5px}
nav{display:flex;gap:6px;max-width:820px;margin:8px auto 0;padding:0 16px 8px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav a{white-space:nowrap;padding:6px 14px;border-radius:99px;border:1px solid var(--ln);color:var(--tx);text-decoration:none;font-size:14px;background:var(--card)}
nav a.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:820px;margin:0 auto;padding:4px 16px 60px}
details{background:var(--card);border:1px solid var(--ln);border-radius:12px;margin:8px 0;overflow:hidden}
summary{padding:11px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}summary::-webkit-details-marker{display:none}
.d{font-weight:700;color:var(--ac);min-width:62px}.c{flex:1;font-weight:600}
.b{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.s0{color:var(--warn)}.s1{color:var(--ok)}.s2{color:var(--no)}
.body{padding:2px 14px 12px;display:grid;gap:8px}label{display:block;font-size:12px;color:var(--mut);margin:0 0 2px}
textarea,input[type=text],select{width:100%;font:inherit;color:var(--tx);background:transparent;border:1px solid var(--ln);border-radius:8px;padding:6px 9px}
textarea{resize:vertical;min-height:36px}textarea:focus,input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}
.leg{display:grid;grid-template-columns:1fr 14px 1fr;gap:5px 6px;align-items:center;padding:7px 0;border-top:1px dashed var(--ln)}
.leg .r2{grid-column:1/-1;display:flex;gap:6px;align-items:center}.leg select{width:64px;flex:none}
a.map{flex:none;text-decoration:none;font-size:13px;background:var(--ac);color:#fff;padding:5px 10px;border-radius:8px;white-space:nowrap}
.row{display:grid;grid-template-columns:1.6fr 90px 100px 90px 1.4fr 32px;gap:6px;align-items:center;margin:6px 0}
.hd{font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;margin:8px 0}
.card h3{margin:0 0 4px;font-size:15px}.ck{display:flex;gap:10px;align-items:center;padding:4px 0}.ck input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac);flex:none}
.ck input[type=text]{border:0;border-bottom:1px solid transparent;border-radius:0;padding:4px 2px}.ck input[type=text]:focus{border-bottom-color:var(--ac);outline:0}
.done input[type=text]{text-decoration:line-through;color:var(--mut)}
button{font:inherit;border:1px dashed var(--ln);background:transparent;color:var(--mut);border-radius:8px;padding:5px 12px;cursor:pointer}
button.x{border:0;padding:2px 6px;font-size:18px;flex:none}
.bar{height:6px;background:var(--ln);border-radius:9px;overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;background:var(--ok)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;display:none}
.it{padding:6px 0;border-top:1px dashed var(--ln)}.it .t{display:flex;gap:6px}.it .t input{border:0;border-bottom:1px solid transparent;border-radius:0;padding:4px 2px}.it .t input:focus{border-bottom-color:var(--ac);outline:0}.it .w{display:flex;gap:12px;align-items:center;margin-top:3px;flex-wrap:wrap}.it .w select{width:auto;padding:3px 6px;font-size:13px}.cb{display:flex;gap:5px;align-items:center;font-size:13px;color:var(--mut)}.cb input{width:18px;height:18px;accent-color:var(--ac)}.it.done .t input{text-decoration:line-through;color:var(--mut)}.flt{display:flex;gap:6px;margin-top:8px}.flt a{padding:4px 12px;border:1px solid var(--ln);border-radius:99px;text-decoration:none;color:var(--tx);font-size:13px}.flt a.on{background:var(--ac);color:#fff;border-color:var(--ac)}.note{font-size:12px;color:var(--mut);margin-top:6px}
.vbar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}.vbar a{flex:none;padding:5px 10px;border-radius:99px;border:1px solid var(--ln);background:var(--card);color:var(--tx);text-decoration:none;font-size:13px}.vbar a.td{background:var(--ac);color:#fff;border-color:var(--ac)}.edbtn{display:block;width:100%;margin:4px 0 8px}.day{background:var(--card);border:1px solid var(--ln);border-radius:14px;margin:10px 0;padding:12px 14px;scroll-margin-top:60px}.day.today{border:2px solid var(--ac)}.dh{display:flex;gap:10px;align-items:baseline;margin-bottom:4px}.dd{font-weight:700;color:var(--ac);flex:none}.dc{font-weight:700;font-size:16px;flex:1}.tg{font-size:12px;background:var(--ac);color:#fff;border-radius:99px;padding:1px 8px}.sec{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--ln)}.lb{flex:none;width:58px;font-size:13px;color:var(--mut);padding-top:2px}.tx{flex:1;min-width:0;overflow-wrap:anywhere}.pre{white-space:pre-wrap}.sub{font-size:12.5px;color:var(--mut)}.btns{display:flex;gap:6px;flex:none}.bt{text-decoration:none;font-size:13px;background:var(--ac);color:#fff;padding:5px 10px;border-radius:8px;white-space:nowrap}.rt{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--tx);padding:7px 9px;margin:0 0 6px;border:1px solid var(--ln);border-radius:10px}.rt .rtt{flex:1;min-width:0;font-size:14px}.rt .go{color:var(--ac);font-size:20px;line-height:1}.chips{display:flex;flex-wrap:wrap;gap:6px}.chips a{text-decoration:none;font-size:13px;padding:5px 11px;border-radius:99px;border:1px solid var(--ac);color:var(--ac)}
.spt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:7px 0;border-top:1px dashed var(--ln)}.spt input{flex:1 1 140px;min-width:0}
@media(max-width:640px){.row{grid-template-columns:1fr 1fr 32px}.row .wide{grid-column:1/-1}.hd{display:none}}
</style><link rel="stylesheet" href="/collab.css"></head><body><header><h1>🧭 欧洲之旅</h1><p>11.25–12.08 ｜ 双人旅行手册 · 实时协作</p><p id="mode" role="status">请先登录</p><div id="people"></div><button id="logout" hidden>退出登录</button><button id="export" hidden>导出备份</button></header><section id="login" class="card"><h3>一起计划下一程</h3><form id="login-form"><label for="account">选择账号</label><select id="account"><option value="1">Yuwen</option><option value="2">Yingyue</option></select><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">进入共同手册</button><p id="error" role="alert"></p></form></section><nav id="nav"></nav><main id="root"></main><div id="toast"></div><script type="module" src="/main.js"></script></body></html>
